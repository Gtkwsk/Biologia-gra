<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 480" width="640" height="480">
  <!-- Schemat komórki grzybowej, rysunek własny (SPEC.md, sekcja 6.2). -->
  <!-- Zgodnie z TRESCI.md, sekcja 2.3: jak komórka zwierzęca (jądro, mitochondria, rybosomy, wakuole), -->
  <!-- ale ze ścianą komórkową zbudowaną z chityny; bez chloroplastów. -->

